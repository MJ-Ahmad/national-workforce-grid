<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integration Core | NWG</title>
  <link rel="stylesheet" href="../../app/shared/css/module-base.css" />
</head>
<body>
  <div class="module-shell">
    <aside class="module-sidebar">
      <div class="sidebar-header">
        <img src="../../assets/images/logo.svg" alt="NWG" />
        <div>
          <p class="eyebrow">Core Module</p>
          <h2>Integration Hub</h2>
        </div>
      </div>
      <nav id="nav-tree" class="nav-tree"></nav>
    </aside>

    <main class="module-main">
      <header class="topbar">
        <div>
          <p class="kicker">Module 9</p>
          <h1>Integration Core</h1>
        </div>
        <button id="lang-toggle">EN | BN</button>
      </header>

      <section class="stats-grid">
        <div class="stat-card"><span>API Endpoints</span><strong>128</strong><small>Active</small></div>
        <div class="stat-card"><span>Requests/Sec</span><strong>45,600</strong><small>Throughput</small></div>
        <div class="stat-card"><span>Uptime SLA</span><strong>99.99%</strong><small>Guaranteed</small></div>
        <div class="stat-card"><span>Avg Latency</span><strong>42ms</strong><small>Response</small></div>
      </section>

      <div class="module-grid">
        <div class="panel">
          <div class="panel-head">
            <h3>API Gateway Status</h3>
            <span class="badge live">Live</span>
          </div>
          <div id="api-status" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>Cross-Module Sync</h3>
          </div>
          <div id="sync-status" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
      </div>
    </main>

    <aside class="module-panel">
      <div class="panel">
        <h3>System Health</h3>
        <p style="margin: 12px 0 0; color: var(--muted);">Integration: <strong style="color: #73e0a9;">Stable</strong></p>
        <p style="margin: 12px 0 0; color: var(--muted);">Sync: <strong style="color: #73e0a9;">In-Sync</strong></p>
      </div>
    </aside>
  </div>

  <footer class="site-footer"></footer>

  <script type="module">
    import { initModule } from '../../app/shared/js/module-init.js';
    await initModule('core');
  </script>
</body>
</html>
