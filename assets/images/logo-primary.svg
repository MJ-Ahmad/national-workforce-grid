<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#47d7b3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2bbd9c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#79b7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="#0B1F2D"/>
  
  <!-- Outer ring -->
  <circle cx="128" cy="128" r="110" stroke="url(#grad-primary)" stroke-width="8" fill="none" opacity="0.8"/>
  
  <!-- Middle circle -->
  <circle cx="128" cy="128" r="85" fill="none" stroke="url(#grad-secondary)" stroke-width="5" opacity="0.6"/>
  
  <!-- Core shield -->
  <g transform="translate(128, 128)">
    <!-- Center diamond (governance) -->
    <path d="M 0,-45 L 32,-15 L 0,15 L -32,-15 Z" fill="url(#grad-primary)" opacity="0.95"/>
    
    <!-- Four quadrants (geographic hierarchy) -->
    <circle cx="0" cy="-35" r="8" fill="url(#grad-secondary)"/>
    <circle cx="35" cy="0" r="8" fill="url(#grad-secondary)"/>
    <circle cx="0" cy="35" r="8" fill="url(#grad-secondary)"/>
    <circle cx="-35" cy="0" r="8" fill="url(#grad-secondary)"/>
    
    <!-- Connecting lines -->
    <line x1="0" y1="-30" x2="0" y2="-15" stroke="url(#grad-primary)" stroke-width="2"/>
    <line x1="30" y1="0" x2="15" y2="0" stroke="url(#grad-primary)" stroke-width="2"/>
    <line x1="0" y1="30" x2="0" y2="15" stroke="url(#grad-primary)" stroke-width="2"/>
    <line x1="-30" y1="0" x2="-15" y2="0" stroke="url(#grad-primary)" stroke-width="2"/>
  </g>
</svg>